name: API documentation redirect

on:
  push:
    branches: [main]
    paths:
      - openapi.json
      - docs/api/**
      - .github/workflows/api-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test legacy links
        run: node --test docs/api/redirect.test.cjs
      - name: Verify the generated docs are live
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            https://docs.detail.dev/references/sources.json -o /tmp/docs-sources.json
          curl --fail --silent --show-error --location --max-time 30 \
            https://docs.detail.dev/references/legacy-api-redirects.json -o /tmp/docs-redirects.json
          curl --fail --silent --show-error --location --max-time 30 \
            https://docs.detail.dev/references/viewer.json -o /tmp/docs-viewer.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          sources = json.loads(Path('/tmp/docs-sources.json').read_text())
          assert sources['formatVersion'] == 1
          assert sources['cli']['commit']
          viewer = json.loads(Path('/tmp/docs-viewer.json').read_text())
          assert viewer['renderer'] == 'scalar' and viewer['route'] == '/api/'
          assert viewer['specSha256'] == sources['openapi']['sha256']
          redirects = json.loads(Path('/tmp/docs-redirects.json').read_text())
          assert '#GET/public/v1/bugs' in redirects
          assert all(re.fullmatch(r'/api/(?:#[^\s]*)?', route) for route in redirects.values())
          Path('/tmp/docs-redirects.js').write_text('window.DETAIL_API_REDIRECTS = ' + json.dumps(redirects) + ';\n')
          PY
      - name: Prepare site
        run: |
          mkdir _site
          cp openapi.json _site/
          cp docs/api/index.html _site/
          cp docs/api/redirect.js _site/
          cp /tmp/docs-redirects.js _site/redirects.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
